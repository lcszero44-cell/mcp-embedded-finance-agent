    <text x="18" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Passagem Aérea SP → Lisboa (Ida &amp; Volta)</text>
    <text x="18" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5">Oferta no carrinho • Consulte seu banco sem sair do app</text>
    <text x="342" y="50" fill="#34d399" font-family="system-ui, sans-serif" font-size="17" font-weight="800">R$ 2.400,00</text>
    <text x="358" y="68" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">≈ US$ 417.39</text>
    <rect x="18" y="80" width="220" height="26" rx="6" fill="#0891b2" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="128" y="97" text-anchor="middle" fill="#cffafe" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Avaliar esta passagem no Chat MCP</text>

    <!-- Accounts Grid -->
    <rect x="0" y="132" width="224" height="86" rx="10" fill="#0b1220" stroke="#1e293b"/>
    <text x="16" y="154" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Conta Corrente •••• 0000</text>
    <text x="16" y="182" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="800">R$ 7.130,00</text>
    <text x="16" y="202" fill="#34d399" font-family="system-ui, sans-serif" font-size="11">Ativo líquido disponível</text>

    <rect x="236" y="132" width="224" height="86" rx="10" fill="#0b1220" stroke="#1e293b"/>
    <text x="252" y="154" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Poupança •••• 1111</text>
    <text x="252" y="182" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="800">R$ 14.087,50</text>
    <text x="252" y="202" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11">Reserva de emergência</text>

    <!-- Credit Card Card -->
    <rect x="0" y="232" width="460" height="114" rx="10" fill="#0b1220" stroke="#f59e0b" stroke-opacity="0.45"/>
    <text x="16" y="255" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cartão de Crédito • Fatura Atual (Dívida — Regra Plaid)</text>
    <text x="16" y="284" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="20" font-weight="800">-R$ 2.357,50</text>
    <text x="315" y="282" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Limite: R$ 11.500,00</text>
    <rect x="16" y="298" width="428" height="8" rx="4" fill="#1e293b"/>
    <rect x="16" y="298" width="88" height="8" rx="4" fill="#f59e0b"/>
    <text x="16" y="328" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Uso: 20,5% • Limite livre: R$ 9.142,50 • Posição líquida: R$ 18.860,00</text>

    <!-- Webhook WhatsApp Preview Card -->
    <rect x="0" y="360" width="460" height="184" rx="10" fill="#052e16" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.45"/>
    <text x="16" y="384" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="12" font-weight="700">🔔 SIMULADOR WEBHOOK → ALERTA WHATSAPP</text>
    <text x="16" y="408" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NovaPay Alerta de Transação (transactions/created)</text>
    <text x="16" y="430" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Estabelecimento: United Airlines — Trecho Nacional</text>
    <text x="16" y="450" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Valor: R$ 1.428,88 (US$ 248.50 | sinal Plaid: + = saída)</text>
    <text x="16" y="470" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Categoria: Viagens &amp; Transporte (+68% acima da média)</text>
    <rect x="16" y="488" width="428" height="40" rx="6" fill="#020617" stroke="#1e293b"/>
    <text x="26" y="505" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10.5">{"event":"transactions/created","itemId":"item_pluggy_sandbox_94a1",</text>
    <text x="26" y="520" fill="#34d399" font-family="ui-monospace, monospace" font-size="10.5">"plaidAmountUsd":248.5,"convertedBrl":1428.88,"fxRate":5.75}</text>
  </g>

  <!-- Right Panel: Chat Interface -->
  <g transform="translate(494, 120)">
    <rect x="0" y="0" width="690" height="544" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Quick Prompt Chips -->
    <rect x="16" y="14" width="658" height="42" rx="8" fill="#020617" stroke="#1e293b"/>
    <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#e2e8f0">
      <rect x="24" y="22" width="136" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="92" y="39" text-anchor="middle">Saldo &amp; Dívida</text>
      <rect x="168" y="22" width="136" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="236" y="39" text-anchor="middle">Top 3 Padrões</text>
      <rect x="312" y="22" width="144" height="26" rx="6" fill="#0891b2" fill-opacity="0.35" stroke="#22d3ee"/>
      <text x="384" y="39" text-anchor="middle" fill="#cffafe">Passagem R$ 2.400?</text>
      <rect x="464" y="22" width="198" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="563" y="39" text-anchor="middle">Item Pluggy &amp; Open Finance</text>
    </g>

    <!-- User Message 1 -->
    <rect x="174" y="72" width="500" height="42" rx="12" fill="#0891b2" fill-opacity="0.28" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="190" y="98" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">
      Posso comprar uma passagem de R$ 2.400 agora sem comprometer meu orçamento?
    </text>

    <!-- Assistant Response 1 -->
    <rect x="16" y="126" width="630" height="190" rx="12" fill="#020617" stroke="#1e293b"/>
    <text x="32" y="150" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">
      Análise de Decisão de Compra — Passagem Aérea (NovaPay Travel)
    </text>
    <text x="32" y="172" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">
      Veredito: Viável com folga no orçamento (R$ 2.400,00 ≈ $417.39 | 1 USD = R$ 5,75)
    </text>
    <text x="32" y="198" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Conta Corrente: R$ 7.130,00 → após a compra restam R$ 4.730,00 livres.</text>
    <text x="32" y="218" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Poupança de R$ 14.087,50 preservada 100% (liquidez pós-compra: R$ 18.817,50).</text>
    <text x="32" y="238" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Cartão de Crédito: fatura atual R$ 2.357,50 (20,5%); no crédito subiria para 41,4%.</text>
    <text x="32" y="262" fill="#67e8f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">
      Recomendação: PIX/Débito à vista pela Conta Corrente preservando a reserva.
    </text>
    <rect x="32" y="278" width="236" height="24" rx="5" fill="#0f172a" stroke="#1e293b"/>
    <text x="42" y="294" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="10.5">plaid-sandbox:accounts/balance/get (39ms)</text>
    <rect x="278" y="278" width="218" height="24" rx="5" fill="#0f172a" stroke="#1e293b"/>
    <text x="288" y="294" fill="#34d399" font-family="ui-monospace, monospace" font-size="10.5">plaid-sandbox:transactions/get (49ms)</text>

    <!-- User Message 2 -->
    <rect x="190" y="330" width="484" height="38" rx="12" fill="#0891b2" fill-opacity="0.28" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="206" y="354" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">
      O que é um Item na Pluggy e qual a diferença para o Open Finance Brasil?
    </text>

    <!-- Assistant Response 2 -->
    <rect x="16" y="380" width="630" height="148" rx="12" fill="#020617" stroke="#1e293b"/>
    <text x="32" y="404" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">
      Pluggy Item &amp; Open Finance Brasil (via pluggy-docs Streamable HTTP)
    </text>
    <text x="32" y="428" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Item: conexão autenticada entre o cliente e um Connector (banco BR), com status</text>
    <text x="42" y="446" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">de sincronização (UPDATED / UPDATING) e acesso a Accounts, Transactions e Webhooks.</text>
    <text x="32" y="470" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Open Finance Brasil (Bacen): consentimento explícito/revogável (FAPI/OAuth2) e</text>
    <text x="42" y="488" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">dados nativos em BRL — diferente do Plaid Sandbox (dados sintéticos em USD).</text>
    <rect x="32" y="498" width="286" height="22" rx="5" fill="#0f172a" stroke="#1e293b"/>
    <text x="42" y="513" fill="#fde68a" font-family="ui-monospace, monospace" font-size="10.5">pluggy-docs:search_docs • https://mcp.pluggy.ai/mcp</text>
  </g>

  <!-- Footer Sandbox Strip -->
  <text x="600" y="696" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">
    Ambiente de Demonstração Sandbox — Dados Fictícios (Plaid Sandbox &amp; Pluggy MCP Docs)
  </text>
</svg>
