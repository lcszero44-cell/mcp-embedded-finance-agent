      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" rx="16" fill="url(#appBg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Top Sandbox Strip -->
  <rect x="16" y="14" width="1168" height="32" rx="6" fill="#451a03" fill-opacity="0.75" stroke="#f59e0b" stroke-opacity="0.5"/>
  <text x="600" y="34" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">
    ⚠ Ambiente de Demonstração Sandbox — Dados Fictícios (Plaid Sandbox &amp; Pluggy MCP Docs)
  </text>

  <!-- App Header -->
  <rect x="16" y="54" width="1168" height="52" rx="10" fill="#0b1220" stroke="#1e293b"/>
  <rect x="30" y="64" width="32" height="32" rx="8" fill="#22d3ee"/>
  <text x="46" y="85" text-anchor="middle" fill="#020617" font-family="system-ui, sans-serif" font-size="13" font-weight="900">NP</text>
  <text x="74" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">NovaPay Travel &amp; Store • Embedded Finance MCP</text>
  <text x="74" y="95" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Assistente Financeiro Embutido • Backend Seguro Etapa 2 • Zero Segredos no Frontend</text>
  <rect x="940" y="67" width="228" height="26" rx="13" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-opacity="0.5"/>
  <text x="1054" y="84" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="11" font-weight="700">plaid-sandbox + pluggy-docs</text>

